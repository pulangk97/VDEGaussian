exhaust_test: false


# ModelParams
scene_type: "Waymo"
resolution_scales: [2, 4, 8, 16]
cam_num: 1
eval: true
num_pts: 600000
#num_pts: 200000
t_init: 0.1
separate_scaling_t: 0.2

# PipelineParams
selected_frames: [0, 200]

# OptimizationParams
iterations: 25000
test_iterations: [15000, 25000]
save_iterations: [15000, 25000]
checkpoint_iterations: [15000, 25000]

opacity_lr: 0.005

densify_until_iter: 15000
densify_grad_threshold: 0.00017
#densify_until_iter: 10000
#densify_grad_threshold: 0.0003
sh_increase_interval: 2000


lambda_v_reg: 0.01
block_start: 8    # 第一个测试块从第9帧开始
block_interval: 10 # 每隔10帧放一个块
block_size: 5    # 每块连续测试帧数
